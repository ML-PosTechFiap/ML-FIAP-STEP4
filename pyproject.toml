[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-monitor"
version = "0.1.0"
description = "Pipeline containerizado de monitoramento de modelo de credit scoring"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "pandera==0.21.0",
    "multimethod==1.10.0",  # pandera 0.21.0 quebra com multimethod>=2 (e avisa em 1.11+)
    "evidently==0.7.23",
    "scipy==1.14.1",
    "pyarrow==17.0.0",
    "mlflow==2.17.2",
    "prometheus-client==0.21.0",
    "requests==2.32.3",
    "kaggle==1.6.17",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
